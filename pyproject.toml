[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-schema-desk"
version = "0.1.0"
description = "Local PostgreSQL and MySQL schema, routine and data explorer"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
drivers = ["psycopg[binary]>=3.2,<4", "PyMySQL>=1.1,<2", "cryptography>=44"]
test = ["playwright>=1.50,<2"]

[project.scripts]
atlas-schema-desk = "atlas.server:main"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.setuptools.package-data]
atlas = ["public/**/*", "public/*"]
