services:
  atlas:
    build: .
    user: "${ATLAS_UID:-1000}:${ATLAS_GID:-1000}"
    ports: ["127.0.0.1:8765:8765"]
    env_file: .env
    volumes:
      - ./atlas.toml:/workspace/atlas.toml:ro
      - ./.local:/workspace/.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs: ["/tmp"]
