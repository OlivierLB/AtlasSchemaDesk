services:
  sulcata:
    build: .
    user: "${SULCATA_UID:-1000}:${SULCATA_GID:-1000}"
    ports: ["127.0.0.1:8765:8765"]
    env_file: .env
    volumes:
      - ./sulcata.toml:/workspace/sulcata.toml:ro
      - ./.local:/workspace/.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs: ["/tmp"]
