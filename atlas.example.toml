[server]
bind = "127.0.0.1"
port = 8765
allowed_db_hosts = ["localhost", "127.0.0.1"]
data_dir = ".local/data"

[[connections]]
id = "library"
label = "Library (PostgreSQL)"
driver = "postgresql"
host = "127.0.0.1"
port = 5432
database = "pagila"
user = "reader"
password_env = "LIBRARY_DB_PASSWORD"
default_schema = "public"
color = "#8ab4f8"
allow_writes = false

