name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm run api:generate --prefix frontend && git diff --exit-code -- frontend/src/api.generated.ts
      - run: npm run typecheck --prefix frontend && npm run lint --prefix frontend && npm run format:check --prefix frontend && npm test --prefix frontend
      - run: make vet
      - name: Windows cross-compilation
        run: GOOS=windows GOARCH=amd64 go vet ./...
      - name: Desktop app builds (Linux WebKitGTK, Windows WebView2)
        run: |
          sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev nsis zip
          go vet -tags desktop,production,webkit2_41 ./...
          GOOS=windows GOARCH=amd64 go vet -tags desktop,production ./...
      - name: Release files build (desktop apps, Windows installer, servers)
        run: SKIP_WINRES=1 scripts/release.sh 0.0.0 "$RUNNER_TEMP/dist"
      - run: for script in get.sh scripts/release.sh scripts/test_get_matrix.sh scripts/local_install.sh scripts/desktop_smoke.sh; do bash -n "$script"; done
      - name: Installer reuses the toolchains and builds
        run: ./install.sh --non-interactive
      - run: pip install -r tests/requirements.txt && python -m playwright install --with-deps firefox
      - run: python -m unittest discover -s tests -p test_check_public.py
      - run: python scripts/check_public.py
      - run: bash tests/run.sh
      - run: python tests/ui_event_window.py
      - run: python scripts/check_distribution.py bin/atlas-schema-desk
      - run: docker build -t atlas-schema-desk:test .
      - run: python scripts/check_docker.py
  windows:
    # install.ps1 from scratch on a real Windows host, with Windows PowerShell 5.1.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install from scratch
        shell: powershell
        run: .\install.ps1 -NonInteractive
      - name: Binary runs and loads the generated configuration
        shell: powershell
        run: |
          bin\atlas-schema-desk.exe version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          bin\atlas-schema-desk.exe inspect --config atlas.toml
          if ($LASTEXITCODE -ne 0) { exit 1 }
